<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfólio pessoal de Mattheus Jordany.">
  <title>Mattheus Jordany | Portfólio</title>
  <style>
    :root { color-scheme: light; font-family: Georgia, serif; background: #f5f1ea; color: #1c2924; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 85% 15%, #d9e8d5 0, transparent 28%), #f5f1ea; }
    main { max-width: 760px; text-align: center; }
    .eyebrow { color: #d65a3a; font: 700 0.78rem/1.2 Arial, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
    h1 { max-width: 600px; margin: 16px auto; font-size: clamp(2.5rem, 8vw, 5.5rem); line-height: .95; letter-spacing: -.04em; }
    p { color: #59675f; font: 1.05rem/1.6 Arial, sans-serif; }
    .choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 36px; }
    a { padding: 22px; border: 1px solid #c9d5ca; border-radius: 12px; color: #1c2924; text-decoration: none; text-align: left; background: rgba(255,255,255,.64); transition: transform .2s, border-color .2s; }
    a:hover { transform: translateY(-4px); border-color: #d65a3a; }
    strong { display: block; margin-bottom: 6px; font: 700 1.1rem Arial, sans-serif; }
    small { color: #59675f; font: .85rem Arial, sans-serif; }
    @media (max-width: 560px) { .choices { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">GAC116 · Programação Web</span>
    <h1>Mattheus Jordany</h1>
    <p>Uma página pessoal desenvolvida em duas versões para comparar diferentes frameworks CSS.</p>
    <div class="choices">
      <a href="bootstrap/index.html"><strong>Versão Bootstrap</strong><small>Interface com Bootstrap 5</small></a>
      <a href="bulma/index.html"><strong>Versão Bulma</strong><small>Interface com Bulma</small></a>
    </div>
  </main>
</body>
</html>
